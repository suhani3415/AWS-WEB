
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <head>

    </head>
<body>
    <h1>Registration form</h1>
    
</html><form method="get" autocomplete="on">
    <label>Name:</label>
    <input type="text" placeholder="Enter your name" >
    <br><br>

    <label>Email:</label>
    <input type="email" placeholder="Enter your email" >
    <br><br>

    <label>Password:</label>
    <input type="password" placeholder="Enter your password" minlength="8" maxlength="20" pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]" required>
    title="Password must contain at least one letter, one number, and one special character">
    <br><br>

    <label>Age:</label>
    <input type="number" placeholder="Enter your age">
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <br><br>

    <label>Country:</label>
    <select>
        <option value="india">India</option>
        <option value="canada">Canada</option>
        <option value="uk">United Kingdom</option>
        <option value="australia">Australia</option>
    </select>
    <br><br>

    <label>Hobbies:</label>
    <input type="checkbox" name="hobby" value="reading"> Reading
    <input type="checkbox" name="hobby" value="swimming"> Swimming
    <input type="checkbox" name="hobby" value="cooking"> Cooking
    <br><br>

    <label>Date:</label>
    <input type="date">
    <br><br> 

    <a href="aboutme.html">
        view about me
    </a>

</body>  

</form>
